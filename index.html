<title>Estêncil · prévia de tatuagem</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>

<header><span class="logo">Estêncil<i></i></span>
<label class="btn" for="fPhoto">Foto</label><label class="btn main" for="fTat">+ Tatuagem</label>
<details><summary class="btn">Projetos</summary><div class="menu">
<input id="pn" type="text" placeholder="Nome do projeto"><button id="bSave">Salvar projeto</button>
<div class="r"><select id="ps"></select></div><div class="r"><button id="bLoad">Abrir</button><button id="bDelP">Apagar</button></div></div></details></header>
<input id="fPhoto" class="vh" type="file" accept="image/*"><input id="fTat" class="vh" type="file" accept="image/*">
<div id="wrap">
<div id="empty"><h2>Veja a tatuagem antes de fazer</h2><p>Escolha uma foto sua e depois o desenho. Você move, gira e ajusta até ficar do jeito certo.</p>
<label class="btn main" for="fPhoto">Escolher foto</label></div>
<div id="stage"><img id="photo" draggable="false" alt="Sua foto"><div id="mesh"></div></div>
<div id="hint" role="status"></div></div>
<div id="panel" style="display:none">
<div class="tools"><button id="bUn">Desfazer</button><button id="bRe">Refazer</button><button id="bMir">Espelhar</button><button id="bFr">Para frente</button><button id="bBk">Para trás</button><button id="bEr">Borracha</button><button id="bRs">Restaurar</button><button id="bMesh">Malha</button><button id="bMR">Redefinir malha</button><button id="bBA">Segure: antes</button><button id="bDel">Remover</button></div>
<div class="tabs"><button class="tab on" data-t="a">Posição</button><button class="tab" data-t="b">Pele</button><button class="tab" data-t="c">Tinta</button></div>
<div class="pane" id="p-a"><small>Um dedo move. Dois dedos: pinça muda o tamanho, giro muda a rotação.</small>
<label><span>Tamanho</span><input id="sz" type="range" min="3" max="80" step="0.5"></label>
<label><span>Rotação</span><input id="rt" type="range" min="-380" max="380" step="1"></label>
<label><span>Largura</span><input id="sx" type="range" min="30" max="160" step="1"></label>
<label><span>Altura</span><input id="sy" type="range" min="30" max="160" step="1"></label>
<label><span>Curvatura</span><input id="bd" type="range" min="-100" max="100" step="1"></label></div>
<div class="pane" id="p-b" hidden>
<label><span>Opacidade</span><input id="op" type="range" min="20" max="100" step="1"></label>
<label><span>Desfoque</span><input id="bl" type="range" min="0" max="4" step="0.1"></label>
<label><span>Cicatrização</span><input id="ag" type="range" min="0" max="100" step="1"></label>
<label><span>Mesclar</span><input id="mx" type="checkbox"><small>a pele sombreia a tinta</small></label></div>
<div class="pane" id="p-c" hidden>
<label><span>Cor</span><input id="co" type="color" value="#2a2f2e"></label>
<label><span>Limpar fundo</span><input id="se" type="range" min="0" max="100" step="1"></label>
<label><span>Pincel</span><input id="br" type="range" min="2" max="25" step="1" value="8"></label>
<label><span>Inverter</span><input id="iv" type="checkbox"><small>desenho claro em fundo escuro</small></label></div>
<div id="res"><button class="btn main" id="bExp">Gerar imagem final</button><div style="height:8px"></div><img id="out" alt="Resultado"><p id="outp"><a id="dl" download="tatuagem.jpg">Baixar imagem</a> ou segure o dedo sobre ela para salvar.</p></div>
</div>
